spring:
  datasource:
    url: jdbc:h2:mem:learnpath-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  ai:
    google:
      genai:
        api-key: test-api-key
jwt:
  secret: test-secret
  expiration-ms: 86400000
