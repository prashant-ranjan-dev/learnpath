spring:
  application:
    name: version1

  datasource:
    url: jdbc:postgresql://localhost:5432/LearnPath
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-3.1-flash-lite

jwt:
  secret: ${jwt_secret_key}
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.learnpath.version1: DEBUG